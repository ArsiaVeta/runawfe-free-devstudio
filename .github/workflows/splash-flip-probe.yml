name: macOS Splash Flip Probe

on:
  workflow_dispatch:
  push:
    branches:
      - fix/splash-screen-macos-orientation

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: curl -L -o swt.jar https://repo1.maven.org/maven2/org/eclipse/platform/org.eclipse.swt.cocoa.macosx.aarch64/3.122.0/org.eclipse.swt.cocoa.macosx.aarch64-3.122.0.jar

      - run: javac -cp swt.jar -d . .github/scripts/SplashFlipProbe.java

      - run: java -XstartOnFirstThread -cp .:swt.jar SplashFlipProbe asis

      - run: java -XstartOnFirstThread -cp .:swt.jar SplashFlipProbe patched

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-result-${{ matrix.os }}
          path: probe-result-*.png